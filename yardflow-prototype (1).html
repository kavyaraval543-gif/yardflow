<style>
/* Light theme only (outdoor use). Layout: the product on the left (phone for driver and gate, full width for the yard dashboard), a demo-control rail on the right. Anek for headings, Mukta for text: both cover English and Hindi. */
:root{
  color-scheme:light;
  --bg:#E9EDF1; --surface:#FFFFFF; --sunk:#F3F5F8; --ink:#15212C; --muted:#56646F; --line:#D3DAE1;
  --accent:#1C5DA6; --accent-t:#E6EEF8; --appbar:#16222D; --appbar-ink:#E8EEF3;
  --ok:#1C7343; --warn:#975800; --bad:#AE2318; --sys:#4A5561;
  --ok-t:#E3F2E9; --warn-t:#FCEFD9; --bad-t:#FBE5E3; --sys-t:#E7EAEE;
  --display:"Anek Devanagari","Mukta",Arial,sans-serif;
  --body:"Mukta","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
header.top h1{font-family:var(--display);font-weight:700;font-size:30px;margin:0;line-height:1}
header.top p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.concept{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:4px 8px}
.roles{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.roles button{flex:1 1 140px;border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:9px 8px;border-radius:7px;cursor:pointer}
.roles button[aria-pressed="true"]{background:var(--appbar);color:var(--appbar-ink)}
.grid{display:grid;grid-template-columns:400px minmax(0,1fr);gap:24px;align-items:start}
.grid.wide{grid-template-columns:minmax(0,1fr) 300px}
@media (max-width:980px){.grid,.grid.wide{grid-template-columns:minmax(0,1fr)}}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:10px;box-shadow:0 18px 40px -26px rgba(10,20,30,.5);max-width:400px;margin:0 auto}
.screen{border-radius:20px;overflow:hidden;background:var(--sunk);height:780px;display:flex;flex-direction:column}
@media (max-width:480px){.phone{border-radius:16px;padding:4px}.screen{border-radius:12px;height:calc(100vh - 150px);min-height:600px}}

.brand{font-family:var(--display);font-weight:700;font-size:19px}

.dot{width:8px;height:8px;border-radius:50%;background:#46C17C;display:inline-block}
.conn.down .dot{background:#F2766B}
.langbtn{border:1px solid rgba(255,255,255,.45);background:transparent;color:var(--appbar-ink);font:600 14px var(--body);border-radius:8px;padding:5px 10px;min-height:36px;cursor:pointer}
.body{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}

.pill.ok{background:var(--ok-t);color:var(--ok)} .pill.warn{background:var(--warn-t);color:var(--warn)} .pill.bad{background:var(--bad-t);color:var(--bad)} .pill.sys{background:var(--sys-t);color:var(--sys)} .pill.neutral{background:var(--sunk);color:var(--ink);border:1px solid var(--line)} .pill.blue{background:var(--accent-t);color:var(--accent)}

textarea.share{width:100%;min-height:150px;font:500 14px var(--body);border:2px solid var(--line);border-radius:10px;padding:10px;resize:vertical;color:var(--ink);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.viewfinder{position:relative;aspect-ratio:4/3;border-radius:14px;background:#0B1116;display:grid;place-items:center;max-width:100%}

.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.checklist li{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.checklist .mk{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;margin-top:1px}
.mk.y{background:var(--ok)} .mk.n{background:var(--bad)} .mk.q{background:var(--line);color:var(--muted)}
.ask{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ask p{margin:0;font-weight:600;font-size:16px}
.bignum{font-family:var(--mono);font-size:26px;letter-spacing:.04em}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{min-height:50px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font:700 17px var(--body);cursor:pointer;color:var(--ink)}
.yn button[aria-pressed="true"].yes{background:var(--ok);border-color:var(--ok);color:#fff}

.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;margin:40px auto 10px}

@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
.rail{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.panel h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ctrl{display:flex;flex-direction:column;gap:10px;font-size:14px}
.ctrl .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.mseg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mseg button{border:0;background:var(--surface);color:var(--muted);font:600 13px var(--body);padding:6px 10px;cursor:pointer}
.mseg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.clockbtns{display:flex;flex-wrap:wrap;gap:6px}
.clockbtns button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font:600 13px var(--body);cursor:pointer;color:var(--ink)}
.clock{font-family:var(--mono);font-size:15px}
select.mini{font:500 14px var(--body);border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);color:var(--ink);max-width:100%}
.log{font-family:var(--mono);font-size:12px;max-height:300px;overflow:auto;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.log div{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.log .ts{color:var(--muted)} .log .ev{color:var(--accent);font-weight:500} .log .fx{color:var(--muted);display:block;word-break:break-word}
.evid{font-size:13px;display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.tag{font-family:var(--mono);font-size:11px;font-weight:500;border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-right:6px;background:var(--sunk)}
/* dashboard */
.dash{display:flex;flex-direction:column;gap:14px;min-width:0}

<div class="wrap">
  <header class="top">
    <div>
      <h1>YardFlow</h1>
      <p>Find a container yard that fits, see its rules and estimated charge before booking, send the pass to the driver, check the truck at the gate, and bill from actual storage time.</p>
    </div>
    <span class="concept">Prototype · demo data · not the original project</span>
  </header>
  <div class="roles" role="group" aria-label="View">
    <button id="role-book" data-role="book">1 · Book storage</button>
    <button id="role-gate" data-role="gate">2 · Security gate</button>
    <button id="role-dash" data-role="dash">3 · Yard dashboard</button>
  </div>
  <div class="grid" id="grid">
    <div id="main"></div>
    <aside class="rail" id="rail"></aside>
  </div>
</div>

<script>
(function(){
'use strict';
/* =========================================================
   Time: the demo clock counts minutes from Fri 16 Oct 2026, 10:00 (shown as local yard time).
   ========================================================= */
const BASE_MS = Date.UTC(2026, 9, 16, 10, 0);
const DAY_OFFSET = 600; // base time is 600 minutes after midnight
const dt = t => new Date(BASE_MS + t * 60000);
const pad = n => String(n).padStart(2, '0');
const hhmm = t => { const d = dt(t); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); };
const dayIdx = t => Math.floor((t + DAY_OFFSET) / 1440);
const dayStart = i => i * 1440 - DAY_OFFSET;
const DN = {en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], hi:['रवि','सोम','मंगल','बुध','गुरु','शुक्र','शनि']};
const MN = {en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], hi:['जन॰','फ़र॰','मार्च','अप्रैल','मई','जून','जुल॰','अग॰','सित॰','अक्टू॰','नव॰','दिस॰']};
const fday = (t, l) => { const d = dt(t); l = l || 'en'; return DN[l][d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MN[l][d.getUTCMonth()]; };
const fdt = (t, l) => fday(t, l) + ', ' + hhmm(t);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const $ = s => document.querySelector(s);

/* =========================================================
   Yard configuration. DEMO DATA: fictional yards, illustrative amounts.
   Tariff structures mirror patterns in published Indian CFS/ICD/terminal
   schedules (per started day, calendar day or part thereof, free day,
   escalating slabs, 40 ft at 2x 20 ft, reefer power per started 4 hours).
   No public hourly storage tariff was found: the hourly yard tests the model.
   ========================================================= */
const YARDS = [
  {id:'KCY', name:{en:'Konkan Container Yard', hi:'कोंकण कंटेनर यार्ड'}, loc:{en:'Uran, Navi Mumbai', hi:'उरण, नवी मुंबई'},
   open:[0,24], sizes:[20,40], types:['dry'], capHour:3, capTEU:120, baseTEU:88, early:60, late:120,
   tariff:{unit:'block24', rate:{20:900, 40:1800}, min:1, max:{n:15, u:'day'}}},
  {id:'PRH', name:{en:'Panvel Reefer Hub', hi:'पनवेल रीफ़र हब'}, loc:{en:'Panvel, Raigad', hi:'पनवेल, रायगढ़'},
   open:[6,22], sizes:[20,40], types:['dry','reefer'], capHour:2, capTEU:60, baseTEU:40, early:30, late:60,
   tariff:{unit:'hour', rate:{20:45, 40:90}, min:6, max:{n:72, u:'hour'}, power:{hours:4, rate:{20:350, 40:500}}}},
  {id:'TCP', name:{en:'Taloja Container Park', hi:'तलोजा कंटेनर पार्क'}, loc:{en:'Taloja MIDC, Navi Mumbai', hi:'तलोजा एमआईडीसी, नवी मुंबई'},

/* =========================================================
   Billing engine: one function for both the estimate and the final bill.
   ========================================================= */
function unitsFor(tf, s, e){
  const m = Math.max(1, e - s);
  if(tf.unit === 'hour') return Math.ceil(m / 60);
  if(tf.unit === 'block24') return Math.ceil(m / 1440);
  return dayIdx(e - 1) - dayIdx(s) + 1; // calendar day or part thereof
}
function rateAt(tf, i, size){
  if(tf.slabs){ const sl = tf.slabs.find(x => i >= x.from && (x.to == null || i <= x.to)); return sl.rate[size]; }
  return tf.rate[size];
}
function bill(y, size, type, s, e){
  const tf = y.tariff, units = unitsFor(tf, s, e), billed = Math.max(units, tf.min || 1);
  const groups = [];
  for(let i = 1; i <= billed; i++){
    const r = rateAt(tf, i, size), g = groups[groups.length - 1];
    if(g && g.r === r){ g.to = i; g.n++; } else groups.push({from:i, to:i, n:1, r});
  }
  groups.forEach(g => { g.amt = g.n * g.r; });
  let power = null;
  if(type === 'reefer' && tf.power){ const blocks = Math.ceil(Math.max(1, e - s) / (tf.power.hours * 60)); power = {blocks, h:tf.power.hours, r:tf.power.rate[size], amt:blocks * tf.power.rate[size]}; }
  const total = groups.reduce((a, g) => a + g.amt, 0) + (power ? power.amt : 0);
  return {unit:tf.unit, mins:e - s, units, billed, minApplied:billed > units, groups, power, total};
}
const maxMins = tf => tf.max.u === 'day' ? tf.max.n * 1440 : tf.max.n * 60;

/* =========================================================
   ISO 6346 container number check and Indian truck number format.
   ========================================================= */
const LV = {}; (() => { let v = 10; for(const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){ if(v % 11 === 0) v++; LV[c] = v; v++; } })();
function checkDigit(s10){ let sum = 0; for(let i = 0; i < 10; i++){ const ch = s10[i]; sum += (/\d/.test(ch) ? +ch : LV[ch]) * Math.pow(2, i); } return (sum % 11) % 10; }
const makeCont = (p, d6) => p + ' ' + d6 + checkDigit(p + d6);
function contCheck(v){ const s = String(v || '').toUpperCase().replace(/[\s-]/g, ''); if(!/^[A-Z]{4}\d{7}$/.test(s)) return {ok:false, k:'e_cont_fmt'}; if(checkDigit(s.slice(0,10)) !== +s[10]) return {ok:false, k:'e_cont_chk'}; return {ok:true, v:s.slice(0,4) + ' ' + s.slice(4)}; }
function truckCheck(v){ const s = String(v || '').toUpperCase().replace(/[\s-]/g, ''); const m = s.match(/^([A-Z]{2})(\d{1,2})([A-Z]{1,3})(\d{4})$/); return m ? {ok:true, v:m[1] + ' ' + m[2] + ' ' + m[3] + ' ' + m[4]} : {ok:false, k:'e_truck'}; }
const mobCheck = v => /^[6-9]\d{9}$/.test(String(v || '').replace(/\D/g, '').slice(-10)) && String(v || '').replace(/\D/g, '').length === 10;

/* text helpers */
function unitCount(n, unit){
  if(unit === 'hour') return n === 1 ? T('u_hour1') : T('u_hours', {n});
  if(unit === 'block24') return n === 1 ? T('u_block1') : T('u_blocks', {n});
  if(unit === 'calendar') return n === 1 ? T('u_cal1') : T('u_cals', {n});
  if(unit === 'day') return n === 1 ? T('u_day1') : T('u_days', {n});
  return n === 1 ? T('u_h1') : T('u_hs', {n});
}
const fdur = m => (m % 1440 === 0) ? unitCount(m / 1440, 'day') : unitCount(Math.round(m / 60), 'h');
const typeName = ty => T(ty === 'reefer' ? 'reefer' : 'dry');
function grpLabel(unit, g, openEnded){
  if(unit === 'hour') return g.from === g.to ? T('lab_h1', {a:g.from}) : T('lab_h', {a:g.from, b:g.to});
  if(unit === 'block24') return g.from === g.to ? T('lab_b1', {a:g.from}) : T('lab_b', {a:g.from, b:g.to});
  if(openEnded) return T('lab_dplus', {a:g.from});
  return g.from === g.to ? T('lab_d1', {a:g.from}) : T('lab_d', {a:g.from, b:g.to});
}
function tariffLines(y, size, type){
  const tf = y.tariff, out = [];
  if(tf.unit === 'hour') out.push(T('b_hour', {r:inr(tf.rate[size]), size}));
  else if(tf.unit === 'block24') out.push(T('b_block', {r:inr(tf.rate[size]), size}));
  else { out.push(T('b_cal', {size})); tf.slabs.forEach(sl => { const lab = grpLabel('calendar', {from:sl.from, to:sl.to}, sl.to == null); out.push(sl.rate[size] === 0 ? T('slab_free', {label:lab}) : T('slab_r', {label:lab, r:inr(sl.rate[size])})); }); }
  if(tf.min > 1) out.push(T('min_l', {v:unitCount(tf.min, tf.unit)}));
  if(type === 'reefer' && tf.power) out.push(T('power_l', {r:inr(tf.power.rate[size]), h:tf.power.hours}));
  return out;
}
function ruleLines(y){
  const tf = y.tariff;
  return [T('max_l', {v:unitCount(tf.max.n, tf.max.u === 'day' ? 'day' : 'h')}),
    y.open[0] === 0 && y.open[1] === 24 ? T('hours24') : T('hours_l', {a:pad(y.open[0]), b:pad(y.open[1])}),
    T('window_l', {e:y.early, l:y.late}), T('start_l'), T('cancel_l')];
}
function calcRows(b, labelTotal){
  const rows = [[T('c_dur', {d:fdur(b.mins)}), ''], [T('c_units', {v:unitCount(b.units, b.unit)}), '']];
  if(b.minApplied) rows.push([T('c_min', {v:unitCount(b.billed, b.unit)}), '']);
  b.groups.forEach((g, i) => { const lab = grpLabel(b.unit, g, false); rows.push([g.r === 0 ? T('slab_free', {label:lab}) : lab + ': ' + g.n + ' × ' + inr(g.r), inr(g.amt)]); });
  if(b.power) rows.push([T('c_power', {n:b.power.blocks, r:inr(b.power.r), h:b.power.h}), inr(b.power.amt)]);
  return '<div class="calc">' + rows.map(r => '<div class="row"><span>' + esc(r[0]) + '</span><span>' + r[1] + '</span></div>').join('') + '<div class="row tot"><span>' + esc(labelTotal || T('c_total')) + '</span><span>' + inr(b.total) + '</span></div></div>';
}

   Search and suitability
   ========================================================= */
function req(){ const f = S.f; const appt = dayStart(dayIdx(S.now) + f.day) + f.hour * 60; const dur = Math.round(+f.durVal) * (f.durUnit === 'day' ? 1440 : 60); return {appt, dur, size:f.size, type:f.type}; }
const active = b => b.status !== 'cancelled' && b.status !== 'exited';
function slotsUsed(y, appt){ const h = dayIdx(appt) * 24 + Math.floor(((appt + DAY_OFFSET) % 1440) / 60); return S.bookings.filter(b => b.yard === y.id && b.status !== 'cancelled' && dayIdx(b.appt) * 24 + Math.floor(((b.appt + DAY_OFFSET) % 1440) / 60) === h).length; }
function teuUsed(y){ return y.baseTEU + S.bookings.filter(b => b.yard === y.id && active(b)).reduce((a, b) => a + teu(b.size), 0); }
function evaluate(y, r){
  const reasons = [], hr = Math.floor(((r.appt + DAY_OFFSET) % 1440) / 60);
  if(!y.sizes.includes(r.size)) reasons.push(T('r_size', {size:r.size}));
  if(!y.types.includes(r.type)) reasons.push(T('r_type'));
  if(r.dur > maxMins(y.tariff)) reasons.push(T('r_max', {max:unitCount(y.tariff.max.n, y.tariff.max.u === 'day' ? 'day' : 'h')}));
  if(hr < y.open[0] || hr >= y.open[1]) reasons.push(T('r_hours', {time:hhmm(r.appt), open:T('hours_l', {a:pad(y.open[0]), b:pad(y.open[1])})}));
  const used = slotsUsed(y, r.appt), free = y.capTEU - teuUsed(y);
  if(used >= y.capHour) reasons.push(T('r_slots', {time:hhmm(r.appt)}));
  if(free < teu(r.size)) reasons.push(T('r_space'));
  const est = (y.sizes.includes(r.size)) ? bill(y, r.size, r.type, r.appt, r.appt + r.dur) : null;
  return {y, ok:reasons.length === 0, reasons, est, slotsFree:Math.max(0, y.capHour - used), teuFree:Math.max(0, free)};
}

function gateVerify(code){
  const g = S.g; g.hint = false; g.codeErr = false; g.reviewSent = false; g.truckOk = null; g.contOk = null; g.gate = 'idle'; g.attempts = 0; g.fault = false;
  g.screen = 'checking'; render();
  setTimeout(() => {
    if(!S.server){ g.screen = 'down'; log('gate_check_unavailable', {code, yard:S.gateYard}); render(); return; }
    const norm = String(code).toUpperCase().replace(/\s/g, '');
    const b = S.bookings.find(x => x.code === norm), y = Y(S.gateYard);
    g.bk = b || null; g.lastCode = norm;
    const checks = [{k:'chk_exists', ok:!!b}], fail = r => { g.reason = r; g.screen = 'refused'; g.checks = checks; log('gate_refused', {code:norm, yard:y.id, reason:TL('en', r.k, r.v)}, b); render(); };
    if(!/^YF-/.test(norm)) { checks[0].ok = false; return fail({k:'f_invalid'}); }
    if(!b) return fail({k:'f_notfound'});
    checks.push({k:'chk_yard', ok:b.yard === y.id}); if(b.yard !== y.id) return fail({k:'f_yard', v:{yard:Y(b.yard).name[S.lang]}});
    const usable = b.status === 'booked'; checks.push({k:'chk_usable', ok:usable});
    if(b.status === 'cancelled') return fail({k:'f_cancel'});
    if(!usable) return fail({k:'f_used', v:{at:b.enteredAt != null ? fdt(b.enteredAt, S.lang) : '—'}});
    const from = b.appt - y.early, to = b.appt + y.late, inWin = S.now >= from && S.now <= to; checks.push({k:'chk_window', ok:inWin});
    if(S.now < from) return fail({k:'f_early', v:{appt:fdt(b.appt, S.lang), from:hhmm(from)}});
    if(S.now > to) return fail({k:'f_late', v:{to:fdt(to, S.lang)}});
    checks.push({k:'chk_truck', ok:null}, {k:'chk_cont', ok:null});
    g.checks = checks; g.screen = 'vehicle'; log('gate_booking_valid', {code:norm, yard:y.id}, b); render();
  }, 600);
}
function sendGate(){
  const g = S.g, b = g.bk; g.attempts++; const cmd = ++g.cmd; g.gate = 'sent'; g.screen = 'gate';
  log('gate_command_sent', {code:b.code, attempt:g.attempts, simulated:true}, b); render();
  setTimeout(() => {
    if(cmd !== g.cmd) return;
    if(S.gateAck){ g.gate = 'confirmed'; if(b.status === 'booked'){ b.status = 'entered'; b.enteredAt = S.now; log('gate_open_confirmed', {code:b.code}, b); log('truck_entered', {code:b.code, truck:b.truck}, b); } }
    else { g.gate = 'unconfirmed'; log('gate_no_reply', {code:b.code, attempt:g.attempts}, b); }
    render();
  }, 1300);
}

function vDash(){
  const d = S.dash, y = Y(d.yard), q = d.q.trim().toUpperCase();
  const mine = S.bookings.filter(b => b.yard === y.id);
  const match = b => !q || [b.code, b.truck.replace(/\s/g, ''), b.cont.replace(/\s/g, ''), b.driver.name.toUpperCase()].some(s => s.toUpperCase().includes(q.replace(/\s/g, '')) || s.toUpperCase().includes(q));
  const list = mine.filter(match);
  const today = dayIdx(S.now);
  const arrivals = list.filter(b => b.status === 'booked').sort((a, b) => a.appt - b.appt);
  const arrivalsToday = mine.filter(b => b.status === 'booked' && dayIdx(b.appt) === today).length;
  const entered = list.filter(b => b.status === 'entered'), stored = list.filter(b => b.status === 'in_storage'), exited = list.filter(b => b.status === 'exited').sort((a, b) => b.storageEnd - a.storageEnd);
  const used = teuUsed(y), pct = Math.round(used / y.capTEU * 100);
  const outstanding = mine.filter(b => b.billing.status === 'outstanding').reduce((a, b) => a + b.billing.amount, 0);
  const recorded = mine.filter(b => b.billing.status === 'paid').reduce((a, b) => a + b.billing.amount, 0);
  const exc = S.exceptions.filter(x => x.yard === y.id && !x.reviewed);
  const code = b => '<button class="rowbtn" data-sel="' + b.id + '">' + esc(b.code) + '</button>';
  const tbl = (head, rows, empty) => rows.length ? '<div class="tw"><table class="dt"><thead><tr>' + head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>' : '<p class="empty">' + empty + '</p>';
  let html = '<div class="dash"><div class="dhead"><h2>Yard dashboard</h2><div class="ytabs" role="group" aria-label="Yard">' + YARDS.map(x => '<button data-dyard="' + x.id + '" aria-pressed="' + (x.id === y.id) + '">' + esc(x.name.en) + '</button>').join('') + '</div></div>' +
    '<div class="note small">Demo yard and illustrative tariff. Times follow the demo clock (' + fdt(S.now) + '). No real payments are taken: staff record payments made outside YardFlow.</div>' +
    '<div class="kpis"><div class="kpi"><div class="v">' + arrivalsToday + '</div><div class="l">Expected arrivals today</div></div>' +
    '<div class="kpi"><div class="v">' + mine.filter(b => b.status === 'booked').length + '</div><div class="l">Booked, not yet arrived</div></div>' +
    '<div class="kpi"><div class="v">' + mine.filter(b => b.status === 'in_storage' || b.status === 'entered').length + '</div><div class="l">Containers inside now</div></div>' +
    '<div class="kpi"><div class="v">' + mine.filter(b => b.status === 'exited').length + '</div><div class="l">Collected (exited)</div></div>' +
    '<div class="kpi"><div class="v">' + (y.capTEU - used) + '</div><div class="l">TEU free of ' + y.capTEU + ' (' + pct + '% used)</div><div class="bar"><i style="width:' + Math.min(100, pct) + '%"></i></div></div>' +
    '<div class="kpi"><div class="v">' + inr(outstanding) + '</div><div class="l">Outstanding · ' + inr(recorded) + ' recorded</div></div></div>' +
    '<label class="field" for="d-q"><span class="lab">Search bookings and containers</span><input class="search" id="d-q" data-dq="1" value="' + esc(d.q) + '" placeholder="Booking code, container, truck or driver" autocomplete="off"></label>' +
    (q && !list.length ? '<p class="empty" role="status">No booking or container at this yard matches “' + esc(d.q) + '”.</p>' : '');
  html += '<section class="dsec"><h3>Exceptions to review <span class="count">' + exc.length + '</span></h3>' + tbl(['Time','Booking','Issue',''], exc.map(x => '<tr><td class="n">' + fdt(x.t) + '</td><td class="mono">' + esc(x.code) + '</td><td>' + esc(x.text) + '</td><td><button class="btn sm" data-review="' + x.id + '">Mark reviewed</button></td></tr>'), 'Nothing to review.') + '</section>';
  html += '<section class="dsec"><h3>Expected arrivals <span class="count">' + arrivals.length + '</span></h3>' + tbl(['Arrival','Booking','Truck','Container','Size / type','Estimate'], arrivals.map(b => '<tr><td class="n">' + fdt(b.appt) + '</td><td>' + code(b) + '</td><td class="mono">' + esc(b.truck) + '</td><td class="mono">' + esc(b.cont) + '</td><td>' + b.size + ' ft ' + b.type + '</td><td class="n">' + inr(b.est.total) + '</td></tr>'), 'No upcoming arrivals.') + '</section>';
  html += '<section class="dsec"><h3>Entered, waiting to be placed <span class="count">' + entered.length + '</span></h3>' + tbl(['Booking','Truck','Container','Entered',''], entered.map(b => '<tr><td>' + code(b) + '</td><td class="mono">' + esc(b.truck) + '</td><td class="mono">' + esc(b.cont) + '</td><td class="n">' + fdt(b.enteredAt) + '</td><td><button class="btn sm" data-place="' + b.id + '">Container placed in storage</button></td></tr>'), 'No containers waiting at the gate area.') + '</section>';
  html += '<section class="dsec"><h3>In storage <span class="count">' + stored.length + '</span></h3>' + tbl(['Booking','Container','Storage start','Time so far','Charge so far',''], stored.map(b => { const c = bill(y, b.size, b.type, b.storageStart, S.now); return '<tr><td>' + code(b) + '</td><td class="mono">' + esc(b.cont) + '</td><td class="n">' + fdt(b.storageStart) + '</td><td class="n">' + withLang('en', () => fdur(Math.max(60, Math.ceil((S.now - b.storageStart) / 60) * 60))) + '</td><td class="n">' + inr(c.total) + '</td><td><button class="btn sm" data-exit="' + b.id + '">Collected: end storage and bill</button></td></tr>'; }), 'No containers in storage.') + '</section>';
  html += '<section class="dsec"><h3>Collected and billed <span class="count">' + exited.length + '</span></h3>' + tbl(['Booking','Container','Storage','Final bill','Payment',''], exited.map(b => '<tr><td>' + code(b) + '</td><td class="mono">' + esc(b.cont) + '</td><td class="n">' + fdt(b.storageStart) + ' → ' + fdt(b.storageEnd) + '</td><td class="n">' + inr(b.billing.amount) + '</td><td>' + payPill(b) + (b.payment ? '<div class="small">' + esc(b.payment.mode) + ' · ' + fdt(b.payment.at) + '</div>' : '') + '</td><td>' +
    (b.billing.status === 'outstanding' ? (d.pay === b.id ? '<div class="payform"><select class="mini" id="pay-mode"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Account / credit</option></select><input class="search" style="min-width:140px" id="pay-ref" placeholder="Receipt or ref (optional)"><button class="btn sm" data-paysave="' + b.id + '">Save record</button><button class="btn sm" data-paycancel="1">Cancel</button></div><div class="small">Records a payment made to the yard outside YardFlow. No money is collected here.</div>' : '<button class="btn sm" data-pay="' + b.id + '">Record payment</button>') : '') + '</td></tr>'), 'No collected containers yet.') + '</section>';
  const sel = S.bookings.find(b => b.id === d.sel && b.yard === y.id);
  if(sel){
    const fin = sel.billing.calc;
    html += '<section class="dsec" id="detail"><h3>Booking ' + esc(sel.code) + ' ' + dashStatus(sel) + '</h3><div class="detail"><div>' +
      '<dl class="kv"><dt>Driver</dt><dd>' + esc(sel.driver.name) + ' · ' + esc(sel.driver.mob) + '</dd>' + (sel.owner ? '<dt>Booked by</dt><dd>' + esc(sel.owner.name) + ' · ' + esc(sel.owner.mob) + '</dd>' : '') +
      '<dt>Truck</dt><dd class="mono">' + esc(sel.truck) + '</dd><dt>Container</dt><dd class="mono">' + esc(sel.cont) + ' · ' + sel.size + ' ft ' + sel.type + '</dd>' +
      '<dt>Appointment</dt><dd>' + fdt(sel.appt) + ' · planned ' + withLang('en', () => fdur(sel.dur)) + '</dd><dt>Storage start</dt><dd>' + (sel.storageStart != null ? fdt(sel.storageStart) : 'Not started') + '</dd><dt>Storage end</dt><dd>' + (sel.storageEnd != null ? fdt(sel.storageEnd) : 'Not ended') + '</dd>' +
      '<dt>Billing</dt><dd>' + payPill(sel) + '</dd>' + (sel.demo ? '<dt>Record</dt><dd>Seeded demo record</dd>' : '') + '</dl>' +
      '<h3 style="margin-top:12px">Estimate at booking</h3>' + withLang('en', () => calcRows(sel.est)) +
      (fin ? '<h3 style="margin-top:12px">Final bill (actual storage time)</h3>' + withLang('en', () => calcRows(fin, 'Final storage charge')) : '') +
      '</div><div><h3>Event history</h3><ol class="tl">' + sel.events.slice().sort((a, b) => a.t - b.t).map(e => '<li><span class="w">' + fdt(e.t) + '</span><span>' + esc(e.type.replace(/_/g, ' ')) + (e.data && e.data.reason ? ': ' + esc(e.data.reason) : '') + (e.data && e.data.amount ? ' · ' + esc(e.data.amount) : '') + (e.data && e.data.mode ? ' · ' + esc(e.data.mode) : '') + '</span></li>').join('') + '</ol></div></div></section>';
  }
  const tf = y.tariff;
  html += '<section class="dsec"><h3>Tariff configuration (demo)</h3><div class="cfg">Basis: <b>' + ({hour:'per started hour', block24:'per started 24-hour block', calendar:'per calendar day or part thereof'}[tf.unit]) + '</b> · Minimum: <b>' + withLang('en', () => unitCount(tf.min, tf.unit)) + '</b> · Maximum stay: <b>' + withLang('en', () => unitCount(tf.max.n, tf.max.u === 'day' ? 'day' : 'h')) + '</b> · Sizes: <b>' + y.sizes.join(', ') + ' ft</b> · Types: <b>' + y.types.join(', ') + '</b> · Hours: <b>' + (y.open[1] - y.open[0] === 24 ? '24 h' : pad(y.open[0]) + ':00–' + pad(y.open[1]) + ':00') + '</b> · Entry window: <b>−' + y.early + ' / +' + y.late + ' min</b> · Arrival slots per hour: <b>' + y.capHour + '</b></div><ul class="facts" style="margin-top:6px">' + withLang('en', () => [20, 40].filter(s => y.sizes.includes(s)).map(s => tariffLines(y, s, y.types.includes('reefer') ? 'reefer' : 'dry').map(x => '<li>' + esc(x) + '</li>').join('')).join('')) + '<li>Billing starts when the container is placed in storage and ends when it is collected.</li></ul></section></div>';
  return html;
}

    '<div class="row"><span>Demo clock</span><span class="clock" id="clock">' + fdt(S.now) + '</span></div>' +

    '<section class="panel"><h3>What is original and what is proposed</h3><ul class="evid">' +

    '<li><span class="tag">A</span>Yards, prices, people, trucks and containers are invented demo data. Tariff structures follow published Indian CFS/ICD/terminal schedules; amounts are illustrative.</li>' +

function render(){
  const keep = {}; document.querySelectorAll('#main input[id], #main select[id]').forEach(el => { if(el.type !== 'checkbox') keep[el.id] = el.value; });
  const focusId = document.activeElement && document.activeElement.id;
  document.querySelectorAll('.roles button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.role === S.role)));
  $('#grid').className = 'grid' + (S.role === 'dash' ? ' wide' : '');
  let html;
  if(S.role === 'book') html = ({search:vSearch, results:vResults, details:vDetails, review:vReview, done:vDone, mine:vMine})[S.step]();
  else if(S.role === 'gate') html = vGate();
  else html = vDash();
  $('#main').innerHTML = html;
  $('#rail').innerHTML = vRail();
  ['pay-ref'].forEach(k => { const el = document.getElementById(k); if(el && keep[k]) el.value = keep[k]; });
  const c = document.getElementById('qr'); if(c) drawQR(c, S.bookings.find(b => b.id === S.openId).code);
  if(focusId){ const el = document.getElementById(focusId); if(el && el.focus) try { el.focus({preventScroll:true}); } catch(e){} }
}
function drawQR(c, seedStr){
  const n = 29, x = c.getContext('2d'); let h = 2166136261;
  for(const ch of seedStr){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1000) / 1000; };
  x.fillStyle = '#fff'; x.fillRect(0, 0, n, n); x.fillStyle = '#111';
  for(let i = 2; i < n - 2; i++) for(let j = 2; j < n - 2; j++) if(rnd() > .52) x.fillRect(i, j, 1, 1);
  [[2,2],[n-9,2],[2,n-9]].forEach(([a, b]) => { x.fillStyle = '#fff'; x.fillRect(a-1, b-1, 9, 9); x.fillStyle = '#111'; x.fillRect(a, b, 7, 7); x.fillStyle = '#fff'; x.fillRect(a+1, b+1, 5, 5); x.fillStyle = '#111'; x.fillRect(a+2, b+2, 3, 3); });
}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.in){ S.f[el.dataset.in] = el.value; if(S.err[el.dataset.in]){ delete S.err[el.dataset.in]; el.removeAttribute('aria-invalid'); const p = el.parentElement.querySelector('.err'); if(p) p.remove(); } }
  if(el.dataset.gin) S.g[el.dataset.gin] = el.value;
  if(el.dataset.dq){ S.dash.q = el.value; render(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.sel){ S.f[el.dataset.sel] = +el.value; delete S.err.hour; render(); }
  if(el.dataset.chk){ S.f[el.dataset.chk] = el.checked; delete S.err.agree; }
  if(el.id === 'gate-yard'){ S.gateYard = el.value; S.g.screen = 'scan'; S.g.bk = null; render(); }
});
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  const id = t.id, ds = t.dataset;
  if(ds.role){ S.role = ds.role; render(); return; }
  if(id === 'lang'){ S.lang = S.lang === 'en' ? 'hi' : 'en'; render(); return; }
  if(ds.adv){ S.now += +ds.adv; render(); return; }
  if(id === 'srv-on' || id === 'srv-off'){ S.server = id === 'srv-on'; render(); return; }
  if(id === 'gate-on' || id === 'gate-off'){ S.gateAck = id === 'gate-on'; render(); return; }
  if(id === 'reset'){ const l = S.lang; seed(); S.lang = l; render(); return; }
  /* booking */
  if(ds.f){ const v = ds.v; S.f[ds.f] = (ds.f === 'day' || ds.f === 'size') ? +v : v; if(ds.f === 'durUnit') delete S.err.durVal; render(); return; }
  if(id === 'dur-minus' || id === 'dur-plus'){ const v = Math.max(1, Math.round(+S.f.durVal || 0) + (id === 'dur-plus' ? 1 : -1)); S.f.durVal = String(v); delete S.err.durVal; render(); return; }
  if(id === 'do-search'){ S.flash = ''; if(validateSearch()){ S.step = 'results'; log('yard_search', {size:S.f.size, type:S.f.type, stay:withLang('en', () => fdur(req().dur)), arrival:fdt(req().appt)}); } render(); return; }
  if(id === 'to-search' || id === 'to-search2'){ S.step = 'search'; render(); return; }
  if(ds.yard){ S.f.yard = ds.yard; S.f.agree = false; S.err = {}; S.step = 'details'; render(); return; }
  if(id === 'to-results'){ S.err = {}; S.step = 'results'; render(); return; }
  if(id === 'to-review'){ if(validateDetails()) S.step = 'review'; render(); return; }
  if(id === 'to-details'){ S.err = {}; S.step = 'details'; render(); return; }
  if(id === 'do-book'){
    const f = S.f; if(!f.agree){ S.err = {agree:{k:'e_agree'}}; render(); return; }
    const y = Y(f.yard), r = req(), ev = evaluate(y, r);
    if(!ev.ok){ S.err = {full:{k:'e_full'}}; render(); return; }
    const b = mkBooking({code:newCode(), yard:y.id, size:r.size, type:r.type, appt:r.appt, dur:r.dur, truck:f.truck, cont:f.cont, driver:{name:f.dname.trim(), mob:f.dmob.replace(/\D/g, '')}, owner:f.who === 'other' ? {name:f.oname.trim(), mob:f.omob.replace(/\D/g, '')} : null});
    S.bookings.push(b); S.mine.push(b.id); S.openId = b.id; S.copyMsg = '';
    log('booking_confirmed', {code:b.code, yard:y.id, appointment:fdt(b.appt), estimate:inr(b.est.total), for_other_driver:!!b.owner}, b);
    S.err = {}; S.step = 'done'; render(); return;
  }
  if(id === 'copy-share'){
    const txt = $('#share-text').value;
    const fail = () => { S.copyMsg = 'copy_fail'; render(); const ta = $('#share-text'); if(ta){ ta.focus(); ta.select(); } };
    try { if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(() => { S.copyMsg = 'copied'; log('pass_details_copied', {code:S.bookings.find(b => b.id === S.openId).code}); render(); }, fail); } else fail(); } catch(err){ fail(); }
    return;
  }
  if(id === 'to-mine' || id === 'to-mine2'){ S.flash = ''; S.confirmCancel = null; S.step = 'mine'; render(); return; }
  if(id === 'new-search' || id === 'new-search2'){ S.flash = ''; S.step = 'search'; render(); return; }
  if(ds.open){ S.openId = ds.open; S.copyMsg = ''; S.step = 'done'; render(); return; }
  if(ds.cancel){ S.confirmCancel = ds.cancel; render(); return; }
  if(ds.cancelNo){ S.confirmCancel = null; render(); return; }
  if(ds.cancelYes){ const b = S.bookings.find(x => x.id === ds.cancelYes); if(b && b.status === 'booked'){ b.status = 'cancelled'; log('booking_cancelled', {code:b.code}, b); S.flash = 'cancelled_ok'; } S.confirmCancel = null; render(); return; }
  /* gate */
  if(ds.scan){ if(ds.scan === 'UNREADABLE'){ S.g.hint = true; log('scan_unreadable', {yard:S.gateYard}); render(); return; } gateVerify(ds.scan); return; }
  if(id === 'g-check'){ const v = String(S.g.code || '').trim(); if(!v){ S.g.codeErr = true; render(); return; } gateVerify(v); return; }
  if(id === 'g-retry'){ gateVerify(S.g.lastCode || S.g.code); return; }
  if(id === 'g-next'){ Object.assign(S.g, {screen:'scan', bk:null, checks:[], gate:'idle', code:'', reason:null, reviewSent:false, hint:false, truckOk:null, contOk:null}); render(); return; }
  if(ds.yn){
    const g = S.g, ok = ds.v === '1';
    if(ds.yn === 'truck'){ g.truckOk = ok; g.checks.find(c => c.k === 'chk_truck').ok = ok; }
    else { g.contOk = ok; g.checks.find(c => c.k === 'chk_cont').ok = ok; }
    if(!ok){ const isT = ds.yn === 'truck'; g.reason = {k:isT ? 'f_truck' : 'f_cont', v:{exp:isT ? g.bk.truck : g.bk.cont}}; g.screen = 'refused';
      log('gate_refused', {code:g.bk.code, reason:TL('en', g.reason.k, g.reason.v)}, g.bk); addException(S.gateYard, g.bk, (isT ? 'Truck number did not match ' : 'Container number did not match ') + (isT ? g.bk.truck : g.bk.cont) + '. Entry refused at the gate.'); }
    render(); return;
  }
  if(id === 'g-review'){ const g = S.g; if(g.reason.k === 'f_early' || g.reason.k === 'f_late') addException(S.gateYard, g.bk, 'Arrived outside the entry window (' + TL('en', g.reason.k, g.reason.v) + '). Supervisor to decide; gate kept closed.'); g.reviewSent = true; render(); return; }
  if(id === 'g-open'){ if(!(S.g.truckOk && S.g.contOk)) return; if(!S.server){ S.g.screen = 'down'; render(); return; } sendGate(); return; }
  if(id === 'g-retrygate'){ sendGate(); return; }
  if(id === 'g-fault'){ const g = S.g; g.gate = 'fault'; g.cmd++; log('gate_fault_reported', {code:g.bk.code}, g.bk); addException(S.gateYard, g.bk, 'Gate controller did not confirm opening after ' + g.attempts + ' attempt(s). Truck not entered; booking still valid.'); render(); return; }
  /* dashboard */
  if(ds.dyard){ S.dash.yard = ds.dyard; S.dash.sel = null; S.dash.pay = null; render(); return; }
  if(ds.sel){ S.dash.sel = ds.sel; render(); const d = document.getElementById('detail'); if(d) d.scrollIntoView({block:'nearest'}); return; }
  if(ds.place){ const b = S.bookings.find(x => x.id === ds.place); if(b && b.status === 'entered'){ b.status = 'in_storage'; b.storageStart = S.now; log('storage_started', {code:b.code, container:b.cont}, b); } render(); return; }
  if(ds.exit){ const b = S.bookings.find(x => x.id === ds.exit); if(b && b.status === 'in_storage'){ b.status = 'exited'; b.storageEnd = S.now; finalize(b, true); S.dash.sel = b.id; } render(); return; }
  if(ds.pay){ S.dash.pay = ds.pay; render(); return; }
  if(ds.paycancel){ S.dash.pay = null; render(); return; }
  if(ds.paysave){ const b = S.bookings.find(x => x.id === ds.paysave); if(b && b.billing.status === 'outstanding'){ const mode = $('#pay-mode').value, ref = ($('#pay-ref').value || '').trim(); b.billing.status = 'paid'; b.payment = {mode, ref, at:S.now, by:'Yard staff'}; log('payment_recorded', {code:b.code, amount:inr(b.billing.amount), mode, ref:ref || '—', note:'recorded by staff; no money handled by YardFlow'}, b); } S.dash.pay = null; render(); return; }
  if(ds.review){ const x = S.exceptions.find(z => z.id === ds.review); if(x){ x.reviewed = true; log('exception_reviewed', {code:x.code}); } render(); return; }
});
seed();
render();
})();
</script>
